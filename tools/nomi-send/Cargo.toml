[package]
name = "nomi-send"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1"
btleplug = "0.11"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
clap = { version = "4", features = ["derive"] }
directories = "5"
fs2 = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "process"] }
uuid = "1"

[dev-dependencies]
tempfile = "3"
